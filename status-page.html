<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
__REFRESH__
<title>__TITLE__</title>
<style>
  :root {
    --bg: #0e0e10; --card: #18181b; --line: #2a2a2e; --text: #f4f4f5; --muted: #a1a1aa;
    --accent: #ff2d6f; --accent2: #22d3ee; --ok: #22c55e; --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { width: 100%; max-width: 560px; background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 32px 36px 26px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  .brand img { height: 26px; }
  .brand span { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
  .state { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600;
    padding: 5px 11px; border-radius: 999px; background: rgba(255,45,111,.14); color: var(--accent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  h1 { font-size: 26px; line-height: 1.25; margin: 14px 0 10px; }
  .msg { font-size: 16px; line-height: 1.5; color: var(--text); background: #232327; border-radius: 12px;
    padding: 14px 16px; margin: 0 0 24px; border-left: 4px solid var(--accent); }
  .bar { height: 14px; border-radius: 999px; background: #2a2a2e; overflow: hidden; }
  .fill { height: 100%; width: __PERCENT__%; border-radius: 999px;
    background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width .8s ease; }
  .row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; }
  .pct { font-size: 22px; font-weight: 700; }
  .detail { font-size: 14px; color: var(--muted); }
  .file { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  .preparing .fill { width: 35%; animation: slide 1.6s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
  .preparing .pct { display: none; }
  .done .state { background: rgba(34,197,94,.14); color: var(--ok); }
  .done .dot { animation: none; }
  .done .msg { border-left-color: var(--ok); }
  .done .fill { width: 100%; background: var(--ok); }
  .retry .state { background: rgba(245,158,11,.14); color: var(--warn); }
  .retry .msg { border-left-color: var(--warn); }
  .retry .fill { background: var(--warn); }
  .notice { font-size: 15px; font-weight: 600; color: var(--warn); background: rgba(245,158,11,.14);
            border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; }
  .notice:empty { display: none; }
  .linespeed { font-size: 12px; color: var(--muted); margin-top: 8px; }
</style>
</head>
